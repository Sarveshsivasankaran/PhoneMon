<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS Local AI — Assistant dashboard</title>
  <link rel="icon" href="favicon.ico">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animation.css">
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <div class="header-left">
        <img src="logo.png" alt="PhoneMon" style="width: 38px; height: 38px; border-radius: 8px; margin-right: 12px; border: 1px solid #7c3aed; object-fit: contain;">
        <div class="reactor-dot" id="systemDot"></div>
        <h1>JARVIS <span>LOCAL AI CONSOLE</span></h1>
      </div>
      <div class="header-right">

        <span class="status-badge" id="activenessBadge">CHECKING...</span>
      </div>
    </header>

    <section class="assistant-preview" aria-label="Animated JARVIS home preview">
      <img class="preview-home" src="home.png" alt="PhoneMon home dashboard">
      <div class="preview-edge" id="previewEdge"></div>
      <section class="preview-agent" id="previewAgent">
        <img src="logo.png" alt="" class="preview-mascot">
        <header><strong id="assistantName">JARVIS</strong><span id="assistantState">STANDBY</span></header>
        <div class="preview-wave" aria-hidden="true"></div>
        <div class="preview-transcript" id="assistantTranscript">Ready when you are.</div>
      </section>
    </section>
    <section class="card assistant-settings">
      <div class="card-header"><h2>ASSISTANT PROFILE</h2><span class="badge" id="profileSync">Saved on this computer</span></div>
      <label>Assistant name<input id="profileName" maxlength="40" value="JARVIS"></label>
      <label>Personality instructions<textarea id="profilePersonality" maxlength="2000" rows="4">Be concise, helpful, and operate the PhoneMon desk panel using its available controls.</textarea></label>
      <label>AI model<select id="profileModel"><option value="qwen2.5-0.5b">Qwen2.5 0.5B Instruct</option><option value="lfm2.5-vl-450m">LFM2.5-VL 450M Vision</option></select></label>
      <button class="btn btn-primary" id="saveProfile">Save assistant profile</button>
    </section>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
